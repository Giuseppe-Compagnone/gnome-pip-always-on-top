name: Build and publish GNOME extension

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build extension
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes gettext gnome-shell unzip

      - name: Validate source
        run: |
          python3 -m json.tool metadata.json >/dev/null
          node --check extension.js

      - name: Build extension bundle
        run: bash scripts/build-extension.sh

      - name: Verify extension bundle
        run: unzip -t dist/pip-always-on-top@giuseppe.shell-extension.zip

      - name: Upload downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: pip-always-on-top
          path: dist/pip-always-on-top@giuseppe.shell-extension.zip
          if-no-files-found: error
          retention-days: 90

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download extension artifact
        uses: actions/download-artifact@v4
        with:
          name: pip-always-on-top
          path: dist

      - name: Publish release with extension asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}"
          asset="dist/pip-always-on-top@giuseppe.shell-extension.zip"
          gh release create "$tag" "$asset" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "GNOME PiP Always on Top $tag" \
            --notes "Automated GNOME Shell extension build from commit $GITHUB_SHA." \
            --prerelease

  publish:
    name: Publish to GNOME Extensions
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check publishing configuration
        id: publishing
        env:
          GNOME_EXTENSIONS_USERNAME: ${{ secrets.GNOME_EXTENSIONS_USERNAME }}
          GNOME_EXTENSIONS_PASSWORD: ${{ secrets.GNOME_EXTENSIONS_PASSWORD }}
        run: |
          if [[ -n "$GNOME_EXTENSIONS_USERNAME" && -n "$GNOME_EXTENSIONS_PASSWORD" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GNOME publishing skipped: configure GNOME_EXTENSIONS_USERNAME and GNOME_EXTENSIONS_PASSWORD."
          fi

      - name: Package and publish extension
        if: steps.publishing.outputs.enabled == 'true'
        uses: murar8/gnome-extensions-action@0.1.1
        with:
          source-dir: .
          output-dir: dist
          podir: po
          gettext-domain: pip-always-on-top@giuseppe
          force: true
          username: ${{ secrets.GNOME_EXTENSIONS_USERNAME }}
          password: ${{ secrets.GNOME_EXTENSIONS_PASSWORD }}
          accept-tos: true
